function stateEvidence(name,st){if(st==="disabled")return `<button disabled data-state-behavior="${name}:disabled" data-disabled-reason="guard_false">${name} 已禁用 · 原因可见</button>`;if(st==="loading")return `<div data-state-behavior="${name}:loading"><progress value="45" max="100"></progress><span>${name} 正在加载 45%</span></div>`;if(st==="empty")return `<div data-state-behavior="${name}:empty"><span>${name} 暂无内容</span><button data-empty-action="safe-return">返回安全状态</button></div>`;if(st==="error")return `<div data-state-behavior="${name}:error" role="alert"><span>${name} 操作失败 · 数据已保留</span><button data-recovery-action="retry">重试</button></div>`;if(st==="editing")return `<label data-state-behavior="${name}:editing">正在编辑 <input value="70" aria-label="实时参数"></label>`;if(st==="dragging")return `<div data-state-behavior="${name}:dragging"><span>拖拽系带</span><button data-drag-action="release">松开提交</button></div>`;if(st==="delete-armed")return `<div data-state-behavior="${name}:delete-armed"><progress value="75" max="100"></progress><button data-delete-action="release-cancel">松开取消</button></div>`;if(st==="countdown")return `<output data-state-behavior="${name}:countdown">3 · 中央倒计时</output>`;if(st==="capturing")return `<div data-state-behavior="${name}:capturing"><progress></progress><span>正在调用公开捕获路径</span></div>`;if(st==="success")return `<div data-state-behavior="${name}:success" role="status">✓ 已保存 · 可退出</div>`;return `<button data-state-behavior="${name}:${st}" aria-pressed="${st==="selected"}">${name} · ${st} 可操作状态</button>`}
const STACK_RULES={EntryGate:"error > loading > disabled > focused",LightPalette:"disabled > selected > focused; custom error scoped; loading suppresses focus",WorkspaceGuardBar:"tracking error > save error > locked > focused",OrbInspector:"entity missing > error > dragging disabled > focused; delete hold overrides focus",LightOrbEntity:"error retains selected/locked semantics; locked > hover; dragging > delete progress; selected > hover ring",PhotoSetup:"permission/error > loading > selected > focused",PhotoExperience:"error > loading > countdown > ready; trigger exit preempts; panel/ray forced hidden",RecoverySurface:"new safety error replaces old issue; loading suppresses focus; cancel remains available",PlacementGuide:"trackingBlocked > capacityBlocked > lockBlocked > resource warning > valid"};
function stackDominant(name,variant,st){if(name==="LightPalette")return st==="disabled"?"disabled":st==="loading"?"loading":mode==="error"&&variant==="customPickerExpanded"?"custom-error":st==="selected"?"selected":"focused";if(name==="WorkspaceGuardBar")return mode==="error"?"tracking-error":variant==="locked"?"locked":st==="loading"?"save-loading":"focused";if(name==="OrbInspector")return st==="empty"?"entity-missing":mode==="error"?"error":st==="dragging"?"dragging-disabled":st==="delete-armed"?"delete-hold":"focused";if(name==="LightOrbEntity")return mode==="error"?"error-with-selection-retained":variant==="locked"||st==="disabled"?"locked":st==="dragging"?"dragging":st==="delete-armed"?"delete-progress":st==="selected"?"selected":"hover";if(name==="PhotoSetup")return mode==="error"?"permission-error":st==="loading"?"loading":st==="selected"?"selected":"focused";if(name==="PhotoExperience")return mode==="error"?"error-ray-panel-hidden":st==="loading"||st==="capturing"?"loading":st==="countdown"?"countdown":"ready";if(name==="RecoverySurface")return mode==="error"?"new-safety-error":st==="loading"?"loading-cancel-visible":"current-issue";if(name==="PlacementGuide")return variant==="trackingBlocked"||mode==="error"?"trackingBlocked":variant==="capacityBlocked"?"capacityBlocked":variant==="lockBlocked"?"lockBlocked":st==="loading"?"resource-warning":"valid";return mode==="error"?"error":st}
function stackEvidence(name,variant,st){const dominant=stackDominant(name,variant,st),rule=STACK_RULES[name];const blocked=/error|disabled|locked|Blocked|missing/.test(dominant);return `<div data-stacking-observable="${name}" data-dominant-state="${dominant}" data-precedence-rule="${rule}" data-combined-signature="${name}:${variant}:${st}:${mode}" role="status"><button ${blocked?"disabled":""} aria-disabled="${blocked}">${dominant} 主导</button><span>${rule}；当前组合应用 ${dominant}，恢复/取消行为保持可见</span></div>`}
function renderLab(){
 const name=q("#component-select").value,d=C[name],variant=q("#variant-select").value,st=q("#component-state").value;

 q("#component-lab").dataset.component=name;q("#component-lab").dataset.variant=variant;q("#component-lab").dataset.componentState=st;
 q("#component-lab").innerHTML=`<b>${name}</b><div class="lab-state">variant: ${variant} · state: ${st} · data: ${dataText}</div><div class="lab-observable" data-variant-observable="${name}:${variant}" data-state-observable="${name}:${st}">${variantEvidence(name,variant,d.v.indexOf(variant))}${stateEvidence(name,st)}</div><div class="element-list">${d.e.map(e=>`<div class="element" data-lab-preview-id="${e[0]}" data-demo-state="${st}"><b>${e[1]}</b><br><small>${e[0]} ← ${e[2]}</small></div>`).join("")}</div><div style="margin-top:10px">${d.b.map((b,i)=>{const meta=bindingMeta(name,b,i);return `<div class="binding" data-binding="${name}:${i}" data-source="${b}" data-target-attribute="${meta.attr}" data-fallback="${b} safe default" data-display-conversion="${meta.conversion}">${b}</div><div class="binding-target" data-binding-target="${name}:${i}" data-value-mode="${mode}" data-converted-value="${meta.value}" aria-label="${meta.value}" style="${meta.style}"><span class="shape ${mode==="error"?"triangle":mode==="fallback"?"square":"circle"}" style="--c:var(--${mode==="error"?"error":mode==="fallback"?"warn":"ready"})"></span> ${meta.value}</div>`}).join("")}</div>${stackEvidence(name,variant,st)}`;
 q("#coverage").textContent="Coverage denominator: 12 states · 19 transitions · 53 elements · 49 bindings · 133 variants/states/stacking · 4 responsive/motion";
}
function fillLab(){const n=q("#component-select").value,d=C[n];q("#variant-select").innerHTML=d.v.map(x=>`<option>${x}</option>`).join("");q("#component-state").innerHTML=d.s.map(x=>`<option>${x}</option>`).join("");renderLab()}
q("#state-select").innerHTML=STATES.map(x=>`<option>${x}</option>`).join("");q("#component-select").innerHTML=Object.keys(C).map(x=>`<option>${x}</option>`).join("");
q("#state-select").onchange=e=>{state=e.target.value;renderScene()};q("#data-mode").onchange=e=>{mode=e.target.value;renderScene();renderLab()};q("#tier-select").onchange=e=>{tier=e.target.value;renderScene()};q("#reduce").onchange=e=>{reduce=e.target.checked;document.body.dataset.reduceMotion=reduce;renderScene()};q("#component-select").onchange=fillLab;q("#variant-select").onchange=renderLab;q("#component-state").onchange=renderLab;
scene.addEventListener("click",e=>{const el=e.target.closest("button,[data-action],[data-frame],[data-countdown]");if(!el)return;const id=el.dataset.previewId,action=el.dataset.action;if(id==="entry_exit_help"){helpVisible=!helpVisible;return renderScene()}if(id==="discard_invalid"){invalidRecordsDiscarded=true;return renderScene()}if(el.dataset.frame){frameStyle=el.dataset.frame;return renderScene()}if(el.dataset.countdown){countdownSeconds=Number(el.dataset.countdown);return renderScene()}if(action==="cycle-color"){colorHex=colorHex==="#ff9a52"?"#88b8ff":colorHex==="#88b8ff"?"#ff65d5":"#ff9a52";return renderScene()}if(id==="enter_stage")return showConfirm("TR-ENTER","S1_ROOM_IDLE");if(id&&id.startsWith("preset_"))return commitTransition("TR-PLACE-AIM","S2_PLACEMENT_AIM");if(id==="layout_lock")return commitTransition(state==="S5_LAYOUT_LOCKED"?"TR-UNLOCK":"TR-LOCK",state==="S5_LAYOUT_LOCKED"?"S1_ROOM_IDLE":"S5_LAYOUT_LOCKED");if(id==="clear_all"){if(state==="S5_LAYOUT_LOCKED"||el.disabled){scene.dataset.blockReason="layout_locked";return}dialogReturnState=state;return commitTransition("TR-CLEAR-OPEN","S6_CLEAR_CONFIRM")}if(id==="photo_entry"){photoReturnState=state;return commitTransition("TR-PHOTO-PREP","S7_PHOTO_PREP")}if(id==="deselect")return commitTransition("BACK-DESELECT","S1_ROOM_IDLE");if(id==="photo_cancel"||action==="photo-exit")return commitTransition("TR-PHOTO-EXIT",photoReturnState);if(id==="photo_start")return showConfirm("TR-PHOTO-READY","S8_PHOTO_READY");if(id==="recovery_cancel")return commitTransition("BACK-RECOVERY",state==="S6_CLEAR_CONFIRM"?dialogReturnState:"S0_SHARED_ENTRY");if(id==="recovery_primary")return commitTransition(state==="S6_CLEAR_CONFIRM"?"TR-CLEAR-CONFIRM":"TRACKING-REGAINED",state==="S6_CLEAR_CONFIRM"?"S1_ROOM_IDLE":recoveryReturnState);if(action==="placement-commit")return commitTransition("TR-PLACE-COMMIT","S1_ROOM_IDLE");if(action==="placement-cancel")return commitTransition("BACK-PLACEMENT","S1_ROOM_IDLE");if(action==="capture-retry")return commitTransition("CAPTURE-RETRY","S7_PHOTO_PREP");if(action==="hold-start"){deleteHoldProgress=50;lastTransition="HOLD-IN-PROGRESS";return renderScene()}if(action==="hold-cancel"){deleteHoldProgress=0;lastTransition="HOLD-RELEASE-CANCEL";return renderScene()}if(action==="hold-complete"){deleteHoldProgress=100;scene.dataset.holdDurationMs="2000";return commitTransition("TR-HOLD-DELETE","S1_ROOM_IDLE")}});
